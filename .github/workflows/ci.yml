name: CI

# main·develop 대상 PR과 push에서 실행 (Git Flow: feature→develop, release/hotfix→main)
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# PR은 새 push마다 이전 실행 취소(head_ref로 그룹), main push는 run_id로 고유 그룹 → 서로 취소 안 함
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
