<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFDF5" />
    <!-- 앱 화면은 검색 노출 대상이 아니다(CHMO-684) — 검색 유입은 랜딩(cheese-moa.com)으로.
         robots.txt 차단은 쓰지 않는다: 크롤러가 이 noindex 를 못 읽어 URL 만 색인에 남는다 -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- iOS 스마트 앱 배너(CHMO-661) — 카톡 밖 Safari로 나온 뒤 앱 설치 유도를 이어받는다.
         Safari 전용이라 앱 웹뷰·Android·데스크톱에는 아무 영향이 없다. id는 lib/appLink.ts와 같은 값 -->
    <meta name="apple-itunes-app" content="app-id=6797158719" />
    <title>치즈모아</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 서체는 Pretendard Variable 한 벌(CHMO-702) — Jua 단일화(CHMO-513)를 B2C 리디자인 방향으로
         대체. 가변 굵기(45~920)라 font-bold가 실제 굵기로 렌더된다. dynamic subset이라 글리프 단위 분할 로딩 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Jua는 워드마크 '치즈모아' 한 곳 전용(CHMO-706) — 본문 서체를 Pretendard로 옮기면서
         브랜드 표기까지 중립 산세리프가 돼 버려 로고 글자만 종전 얼굴로 되돌린다 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
